<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Your Solgram referral code.">
    <title>Solgram — Referral Code</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="canonical" href="/referral/">

    <!-- Link-preview image for share cards (WhatsApp, Instagram, iMessage, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Solgram">
    <meta property="og:title" content="Solgram — Referral Code">
    <meta property="og:description" content="Your Solgram referral code.">
    <meta property="og:image" content="https://solgram.world/assets/icon_master.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta property="og:url" content="https://solgram.world/referral/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Solgram — Referral Code">
    <meta name="twitter:description" content="Your Solgram referral code.">
    <meta name="twitter:image" content="https://solgram.world/assets/icon_master.png">
    <style>
      .referral {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }
      .referral__card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 2rem 1.75rem;
        text-align: center;
      }
      .referral__logo {
        height: 40px;
        width: auto;
        margin-bottom: 1.5rem;
      }
      .referral__logo-big {
        display: block;
        width: 140px;
        height: 140px;
        object-fit: contain;
        border-radius: 28px;
        margin: 0 auto 1.75rem;
      }
      .referral__missing {
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="page referral">
      <div class="referral__card">
        <img
          class="referral__logo"
          id="referral-logo"
          src="/assets/solgram-logo.svg"
          alt="Solgram"
        >
        <div id="referral-content">
          <p class="referral__missing">No referral code found in this link.</p>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var ONELINK_URL = "https://solgram.onelink.me/kyZR/referral2026";
        var REDIRECT_DELAY_SECONDS = 1;

        function getParam(name) {
          var match = new RegExp("(?:^|[?&])" + name + "=([^&]*)").exec(location.search);
          return match ? decodeURIComponent(match[1].replace(/\+/g, " ")) : null;
        }

        var code = getParam("referral_code") || getParam("deep_link_sub1");
        var content = document.getElementById("referral-content");
        if (!code) return;

        var logoEl = document.getElementById("referral-logo");
        if (logoEl) logoEl.style.display = "none";

        // A plain store URL carries no install referrer, so the code would never
        // reach a fresh install. Route through the OneLink instead, preserving
        // the query string — that's what generates the Play install referrer.
        // AppsFlyer reads the REAL request's user agent when this URL is hit
        // (by an auto-redirect or a manual tap), so it always lands on the
        // right store even if our own UA sniffing below guesses wrong.
        var oneLinkUrl = ONELINK_URL + location.search;

        var ua = navigator.userAgent || navigator.vendor || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        // Best-effort guess, used only to decide whether to auto-redirect —
        // "Desktop site" mode or an unusual browser can make this come out
        // false on an actual phone, which is why the manual link below
        // never depends on it.
        var storeUrl = (isAndroid || isIOS) ? oneLinkUrl : null;
        var skipRedirect = getParam("noredirect") === "1";

        content.innerHTML =
          '<img class="referral__logo-big" src="/assets/icon_master.png" alt="Solgram">' +
          '<a class="btn" href="' + oneLinkUrl + '">Continue to Solgram →</a>';

        if (!storeUrl || skipRedirect) return;

        setTimeout(function () {
          location.replace(storeUrl);
        }, REDIRECT_DELAY_SECONDS * 1000);
      })();
    </script>
  </body>
</html>

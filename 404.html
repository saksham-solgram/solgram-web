<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Solgram">
    <title>Solgram</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Link-preview image for share cards (WhatsApp, Instagram, iMessage, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Solgram">
    <meta property="og:title" content="Solgram">
    <meta property="og:description" content="Open this in the Solgram app.">
    <meta property="og:image" content="https://solgram.world/assets/icon_master.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Solgram">
    <meta name="twitter:image" content="https://solgram.world/assets/icon_master.png">

    <style>
      .redirect {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }
      .redirect__card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 2rem 1.75rem;
        text-align: center;
      }
      .redirect__logo {
        height: 40px;
        width: auto;
        margin-bottom: 1.5rem;
      }
      .redirect__thumb {
        display: block;
        width: 96px;
        height: 96px;
        object-fit: contain;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        margin: 0 auto 1.25rem;
      }
      .redirect__label {
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .redirect__sku {
        font-family: "Hedvig Letters Serif", "Hanken Grotesk", serif;
        font-size: 1.6rem;
        letter-spacing: 0.02em;
        color: var(--brand);
        margin: 0 0 1.25rem;
        word-break: break-all;
      }
      .redirect__hint {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .redirect__status {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .redirect__manual {
        display: inline-block;
        margin: 1rem 0 0;
        color: var(--brand);
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
      .redirect__manual:hover {
        text-decoration: underline;
      }
      .redirect__missing {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .redirect__home {
        display: inline-block;
        margin-top: 0.75rem;
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page redirect">
      <div class="redirect__card">
        <img class="redirect__logo" src="assets/solgram-logo.svg" alt="Solgram">
        <div id="redirect-content">
          <p class="redirect__missing">Page not found.</p>
          <a class="redirect__home" href="/">Go to solgram.world →</a>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // GitHub Pages has no server-side router, so any URL path that isn't a
        // real file (like /product/<sku>) lands on this 404 page instead. We
        // use that to fake path-based routing: parse the path ourselves and,
        // for the patterns we support, render the real content client-side.
        // The HTTP status stays 404, which is harmless for app-installed users
        // (Universal Links/App Links open the app without ever loading this
        // page) but means chat-app link previews may not always render.
        var ONELINK_URL = "https://solgram.onelink.me/kyZR/referral2026";
        var API_BASE = "https://api.solgram.world";
        var REDIRECT_DELAY_SECONDS = 3;

        var match = /^\/product\/([^/]+)\/?$/.exec(location.pathname);
        if (!match) return; // real 404 — leave the default "page not found" content

        var sku = decodeURIComponent(match[1]);
        var content = document.getElementById("redirect-content");

        // Same OneLink used for referral — no separate OneLink per feature.
        // deep_link_sub2 (distinct from referral's deep_link_sub1) is a
        // reserved AppsFlyer param, so it survives Play Store install-referrer
        // stripping the way an unregistered custom param would not. af_dp is
        // read by the app when it's already installed (direct open).
        var params =
          "?af_dp=" + encodeURIComponent("solgram://product/" + sku) +
          "&deep_link_sub2=" + encodeURIComponent(sku) +
          "&deep_link_value=" + encodeURIComponent(sku);
        var oneLinkUrl = ONELINK_URL + params;

        var ua = navigator.userAgent || navigator.vendor || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var storeUrl = (isAndroid || isIOS) ? oneLinkUrl : null;
        var storeName = isAndroid ? "Play Store" : "App Store";
        var skipRedirect = /(?:^|[?&])noredirect=1(?:&|$)/.test(location.search);

        content.innerHTML =
          '<img class="redirect__thumb" id="redirect-thumb" style="display:none" alt="">' +
          '<p class="redirect__label">Opening this product in Solgram</p>' +
          '<p class="redirect__sku" id="redirect-title">' + sku + '</p>' +
          '<p class="redirect__hint">Don’t have the app yet? Install it and this product will open automatically.</p>' +
          (storeUrl && !skipRedirect
            ? '<p class="redirect__status" id="redirect-status"></p>'
            : "") +
          '<a class="redirect__manual" href="' + oneLinkUrl + '">Continue to Solgram →</a>';

        // Decorative only — fills in the product name/image once the API
        // responds. Never blocks or delays the redirect below: OG tags are
        // static (GitHub Pages can't render per-product previews), so this
        // only improves what a visitor sees if they load the page directly.
        fetch(API_BASE + "/api/products/sku/" + encodeURIComponent(sku))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (json) {
            var data = json && json.success && json.data;
            if (!data) return;
            var titleEl = document.getElementById("redirect-title");
            var thumbEl = document.getElementById("redirect-thumb");
            var imageUrl = data.pdp_url || (data.sku_img && data.sku_img[0]);
            if (titleEl && data.sku_name) titleEl.textContent = data.sku_name;
            if (thumbEl && imageUrl) {
              thumbEl.src = imageUrl;
              thumbEl.style.display = "block";
            }
          })
          .catch(function () {});

        if (!storeUrl || skipRedirect) return;

        var secondsLeft = REDIRECT_DELAY_SECONDS;
        var statusEl = document.getElementById("redirect-status");
        function tick() {
          statusEl.textContent =
            "Taking you to the " + storeName + " in " + secondsLeft + "s…";
          if (secondsLeft <= 0) {
            location.replace(storeUrl);
            return;
          }
          secondsLeft -= 1;
          setTimeout(tick, 1000);
        }
        tick();
      })();
    </script>
  </body>
</html>

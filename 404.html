<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Solgram">
    <title>Solgram</title>
    <link rel="stylesheet" href="/styles.css">

    <!-- Link-preview image for share cards (WhatsApp, Instagram, iMessage, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Solgram">
    <meta property="og:title" content="Solgram">
    <meta property="og:description" content="Open this in the Solgram app.">
    <meta property="og:image" content="https://solgram.world/assets/icon_master.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Solgram">
    <meta name="twitter:image" content="https://solgram.world/assets/icon_master.png">

    <style>
      .redirect {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }
      .redirect__card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 2rem 1.75rem;
        text-align: center;
      }
      .redirect__logo {
        height: 40px;
        width: auto;
        margin-bottom: 1.5rem;
      }
      .redirect__logo-big {
        display: block;
        width: 140px;
        height: 140px;
        object-fit: contain;
        border-radius: 28px;
        margin: 0 auto 1.75rem;
      }
      .redirect__missing {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .redirect__home {
        display: inline-block;
        margin-top: 0.75rem;
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page redirect">
      <div class="redirect__card">
        <img class="redirect__logo" id="redirect-logo" src="/assets/solgram-logo.svg" alt="Solgram">
        <div id="redirect-content">
          <p class="redirect__missing">Page not found.</p>
          <a class="redirect__home" href="/">Go to solgram.world →</a>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // GitHub Pages has no server-side router, so any URL path that isn't a
        // real file (like /product/<sku>) lands on this 404 page instead. We
        // use that to fake path-based routing: parse the path ourselves and,
        // for the patterns we support, render the real content client-side.
        // The HTTP status stays 404, which is harmless for app-installed users
        // (Universal Links/App Links open the app without ever loading this
        // page) but means chat-app link previews may not always render.
        var ONELINK_URL = "https://solgram.onelink.me/kyZR/referral2026";
        var REDIRECT_DELAY_SECONDS = 1;

        // Every supported deep-link type follows the exact same routing
        // recipe as /product/<sku> (same OneLink, same param names) — the
        // app-side scheme (solgram-rn://<type>/<code>) doesn't exist yet on
        // the app team's end; this is the spec we're handing them.
        var ROUTES = [
          { type: "product", regex: /^\/product\/([^/]+)\/?$/, label: "product" },
          { type: "category", regex: /^\/category\/([^/]+)\/?$/, label: "category" },
          { type: "subcategory", regex: /^\/subcategory\/([^/]+)\/?$/, label: "subcategory" },
        ];

        var route, match;
        for (var i = 0; i < ROUTES.length; i++) {
          match = ROUTES[i].regex.exec(location.pathname);
          if (match) { route = ROUTES[i]; break; }
        }
        if (!route) return; // real 404 — leave the default "page not found" content

        var code = decodeURIComponent(match[1]);
        var content = document.getElementById("redirect-content");
        var logoEl = document.getElementById("redirect-logo");
        if (logoEl) logoEl.style.display = "none";

        // Same OneLink used for referral — no separate OneLink per feature.
        // deep_link_sub2 (distinct from referral's deep_link_sub1) is a
        // reserved AppsFlyer param, so it survives Play Store install-referrer
        // stripping the way an unregistered custom param would not. af_dp is
        // read by the app when it's already installed (direct open); on a
        // fresh install we can't yet confirm af_dp itself survives, so the
        // type also goes in its own reserved param (deep_link_sub3) rather
        // than making the app parse it back out of af_dp.
        var params =
          "?af_dp=" + encodeURIComponent("solgram-rn://" + route.type + "/" + code) +
          "&deep_link_sub2=" + encodeURIComponent(code) +
          "&deep_link_sub3=" + encodeURIComponent(route.type) +
          "&deep_link_value=" + encodeURIComponent(code);
        var oneLinkUrl = ONELINK_URL + params;

        var ua = navigator.userAgent || navigator.vendor || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var storeUrl = (isAndroid || isIOS) ? oneLinkUrl : null;
        var skipRedirect = /(?:^|[?&])noredirect=1(?:&|$)/.test(location.search);

        content.innerHTML =
          '<img class="redirect__logo-big" src="/assets/icon_master.png" alt="Solgram">' +
          '<a class="btn" href="' + oneLinkUrl + '">Continue to Solgram →</a>';

        if (!storeUrl || skipRedirect) return;

        setTimeout(function () {
          location.replace(storeUrl);
        }, REDIRECT_DELAY_SECONDS * 1000);
      })();
    </script>
  </body>
</html>
